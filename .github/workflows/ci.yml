# Continuous integration for the JARVIS monorepo.
#
# Gated here; any genuine failure fails the run:
#   lint, typecheck and build for every workspace, and the test suites of
#   @jarvis/api, @jarvis/memory, @jarvis/n8n and @jarvis/web.
#
# Deliberately not gated yet (docs/DEVELOPMENT.md, "Continuous integration"):
#   - Postgres-backed tests: @jarvis/db, and the API's real-PostgreSQL file.
#     They stay separate until a pgvector service container is configured.
#     Without a database that API file skips itself, and the memory end-to-end
#     test runs against its in-process store.
#   - `pnpm --filter @jarvis/api run typecheck:tests`. It fails today with 60
#     pre-existing errors: ledger risk R-18, still OPEN. This workflow does not
#     run it, so a green run says nothing about it.
#   - The tests of the other workspaces, secret scanning and dependency audits
#     (audit finding SEC-7).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 — the same major the production image runs (R-19). The test
      # toolchain (jsdom 30, undici 8) requires ^22.22.2 or ^24.15.0, so Node 20
      # could not start the web tests at all; since the image moved to Node 24,
      # this job exercises the runtime production uses instead of another major.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `turbo build` does not run `prisma generate`, and @jarvis/db compiles
      # against the generated client. Same order as the Dockerfile.
      - name: Generate Prisma client
        run: pnpm --filter @jarvis/db exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        id: build
        run: pnpm build

      # Each test step runs once the build has succeeded, even if an earlier
      # test step failed, so one run reports every failing suite. Any failure
      # still fails the job.
      - name: Test @jarvis/api
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/api test

      - name: Test @jarvis/memory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/memory test

      - name: Test @jarvis/n8n
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/n8n test

      - name: Test @jarvis/web
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/web test
