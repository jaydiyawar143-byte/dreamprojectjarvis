# Continuous integration for the JARVIS monorepo.
#
# Gated here; any genuine failure fails the run:
#   lint, typecheck and build for every workspace, the TEST-FILE typecheck of
#   @jarvis/api, and the test suites of @jarvis/api, @jarvis/memory,
#   @jarvis/n8n, @jarvis/omniroute and @jarvis/web.
#   The PostgreSQL-backed tests, against a fresh pgvector database that exists
#   for this run only: every migration is applied to it first, then all of
#   @jarvis/db, the `pg.integration` files of @jarvis/memory and @jarvis/api,
#   and the API's memory end-to-end test run against it. The test steps above
#   still run without a database, where those files skip themselves; in the
#   database steps a skipped test fails the run.
#   Phase 14 — the memory contracts of @jarvis/core, @jarvis/tools and
#   @jarvis/agents (by file name: their other tests are still not gated), and
#   the memory quality evaluation, printed as a report. In the database steps
#   JARVIS_REQUIRE_POSTGRES=1 makes the two memory end-to-end tests FAIL rather
#   than fall back or skip if PostgreSQL cannot be reached, and the skip check
#   reads the evaluation's report too, so it cannot pass with its tests skipped.
#   No step calls a model provider: the real-embedding evaluation is opt-in and
#   never runs here.
#   Phase 15 — the marketing contracts of @jarvis/core, @jarvis/tools,
#   @jarvis/agents, @jarvis/browser and @jarvis/meta-graph, by file name, for
#   the reason the memory contracts are: those workspaces are not gated as a
#   whole. The marketing end-to-end test and the marketing repository test are
#   PostgreSQL-backed and run in the database steps, where a skip fails the
#   run. No step reaches a provider: the Page publisher and the page reader are
#   tested against stand-ins.
#   Phase 17 — the whole test suite of @jarvis/security (the automation
#   Permission and Risk Engine), and the TEST-FILE typecheck widened: the
#   Phase 17 test files of @jarvis/db and @jarvis/security, and the API's
#   operator scripts (`apps/api/scripts`, which the API's lint now covers too).
#   Phase 17 multi-business hardening — the shared-connection contracts of
#   @jarvis/tools and @jarvis/agents, by file name; their PostgreSQL-backed
#   tests in @jarvis/db and @jarvis/api run in the database steps.
#   Phase 18, Stage 18.1 — the Automation Library's rules in @jarvis/core, by
#   file name; its PostgreSQL suites in @jarvis/db and @jarvis/api run in the
#   database steps.
#   Phase 18, Stage 18.2 — the same slice widened to @jarvis/tools and
#   @jarvis/agents (the executor and the orchestrator refusing a spoken
#   library sync), by file name; the tools,
#   the continue-until-complete chains and the voice marker run in
#   "Test @jarvis/api", their PostgreSQL suites in the database steps.
#   Phase 18, Stage 18.3B — the inspection and proposal contracts join the
#   same slice (core, tools); the service, flow and routes run in
#   "Test @jarvis/api", the reduced n8n read in "Test @jarvis/n8n", and the
#   allow-list's PostgreSQL suite in the database steps.
#   Phase 18, Stage 18.4 — workflow matching and drafts: their contracts in
#   the same slice (core, tools, agents), the service and routes in
#   "Test @jarvis/api", the page in "Test @jarvis/web", and the draft store's
#   PostgreSQL suite (immutability trigger included) in the database steps.
#   Phase 19, Stage 19.1 — the Computer & Browser Control contracts of
#   @jarvis/core and the executor's refusal of a spoken sensitive action in
#   @jarvis/tools, by file name. The supporting authorization policy is in
#   @jarvis/security, which is gated as a whole, and the API's approval summary
#   is in "Test @jarvis/api". Nothing in this slice starts a browser or a
#   desktop agent. Its write-boundary hardening adds two slices of
#   @jarvis/tools (and core), by file name: the Meta Ads write contracts (the
#   nine writes run only with the executor's grant; `meta-ads` and the
#   journal, timeout and concurrency suites of the same tools), and the
#   byte-for-byte pins of the executor and the registry, which until then ran
#   only locally. No step reaches Meta: the provider is the in-memory mock.
#   Phase 19.6 — the Windows desktop agent. Its TypeScript protocol contract
#   (`computer-control-desktop-protocol-p19` in @jarvis/core, which also fails
#   when the generated apps/desktop-agent/contract files drift) runs in the
#   computer-control slice; the service, routes and approvals in "Test
#   @jarvis/api"; the Computer Control page in "Test @jarvis/web"; the pairing,
#   consent, revocation and command suites against PostgreSQL in the database
#   steps (`desktop-agent-p19-pg` in @jarvis/db and @jarvis/api), where a skip
#   fails. The .NET agent itself is built, tested, packaged, signed with a
#   throwaway test certificate and verified in the `desktop-agent` job on
#   windows-latest. No step sends input to a desktop or pairs a real device.
#
# Deliberately not gated yet (docs/DEVELOPMENT.md, "Continuous integration"):
#   - Most test files OUTSIDE @jarvis/api. `typecheck:tests` runs in
#     @jarvis/api (its sources, tests and scripts) and, for their Phase 17
#     test files only, in @jarvis/db and @jarvis/security; every other
#     package's tsconfig covers `src/**` alone. The older test files of
#     @jarvis/db and @jarvis/security (15 errors) and `apps/api/scripts/
#     phase116b` (23 errors) do not type-check today and are left out by name
#     until they are fixed or retired. `apps/web` is the exception: its
#     tsconfig already includes tests, so `Typecheck` covers it. The task is
#     defined in turbo.json rather than inlined here, so adding the script to
#     another workspace gates it automatically.
#   - The tests of the other workspaces, secret scanning and dependency audits
#     (audit finding SEC-7).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway database for the PostgreSQL-backed tests: created empty for
    # this job and discarded with it. The credentials are fixed test values, not
    # secrets. Port 5436, the throwaway port the local runs use, away from 5432
    # and 5433 — the development and deployment databases. Two of the suites
    # (the L5 memory ones) refuse those ports outright; the rest would run
    # against any database. Steps start once it reports ready.
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: jarvis_ci
          POSTGRES_PASSWORD: jarvis_ci
          POSTGRES_DB: jarvis_ci
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_ci -d jarvis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 — the same major the production image runs (R-19). The test
      # toolchain (jsdom 30, undici 8) requires ^22.22.2 or ^24.15.0, so Node 20
      # could not start the web tests at all; since the image moved to Node 24,
      # this job exercises the runtime production uses instead of another major.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `turbo build` does not run `prisma generate`, and @jarvis/db compiles
      # against the generated client. Same order as the Dockerfile.
      - name: Generate Prisma client
        run: pnpm --filter @jarvis/db exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Test files are compiled by nothing else: each workspace's `typecheck`
      # covers `src/**` only. This is the gate that keeps R-18 closed — it was
      # brought to 0 errors before being switched on here, so it has never been
      # allowed to land red.
      - name: Typecheck test files
        run: pnpm typecheck:tests

      - name: Build
        id: build
        run: pnpm build

      # Each test step runs once the build has succeeded, even if an earlier
      # test step failed, so one run reports every failing suite. Any failure
      # still fails the job.
      - name: Test @jarvis/api
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/api test

      - name: Test @jarvis/memory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/memory test

      - name: Test @jarvis/n8n
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/n8n test

      - name: Test @jarvis/omniroute
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/omniroute test

      - name: Test @jarvis/web
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/web test

      # Phase 14 — the memory contracts that live outside the gated workspaces:
      # the learning gate, provenance, validation and evidence (L1–L4), the
      # user's controls (L5), the relevance score, confidence levels and the
      # retention policy in core; the memory tools; and the detector, the
      # agent boundary and scoped recall in agents. Selected by file name, so
      # this gates memory without gating those workspaces' other tests.
      - name: Test memory contracts (@jarvis/core, @jarvis/tools, @jarvis/agents)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm --filter @jarvis/core exec vitest run memory learning
          pnpm --filter @jarvis/tools exec vitest run memory-tools
          pnpm --filter @jarvis/agents exec vitest run memory

      # Phase 15 — the marketing contracts that live outside the gated
      # workspaces: the content lifecycle, the SEO audit, the report arithmetic
      # and the recommendation rules in core; the marketing tools, with the
      # approval-gated publish; the marketing agent's allowlist, routing and
      # gates in agents; the page fetcher that contains what a page read may
      # reach; and the Facebook Page publisher. Selected by file name, so this
      # gates marketing without gating those workspaces' other tests.
      - name: Test marketing contracts (@jarvis/core, @jarvis/tools, @jarvis/agents, @jarvis/browser, @jarvis/meta-graph)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm --filter @jarvis/core exec vitest run marketing seo-audit
          pnpm --filter @jarvis/tools exec vitest run marketing-tools
          pnpm --filter @jarvis/agents exec vitest run marketing-agent
          pnpm --filter @jarvis/browser exec vitest run page-fetcher
          pnpm --filter @jarvis/meta-graph exec vitest run page-publisher

      # Phase 17 — the automation Permission and Risk Engine. Its own tests are
      # the only ones that exercise grant-checked fallback across REST and MCP,
      # every membership role and every refusal code; the API's route tests
      # reach it through MCP alone. The whole workspace, as for @jarvis/n8n.
      - name: Test @jarvis/security
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/security test

      # Phase 17 (multi-business hardening) — the shared-connection contracts
      # that live outside the gated workspaces: the executor's access gate and
      # the Meta write tools' Organization scope in tools; the orchestrator's
      # gate and the pending actions that wait for an independent approver in
      # agents. Selected by file name, as the memory and marketing contracts are.
      - name: Test shared-connection contracts (@jarvis/tools, @jarvis/agents)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm --filter @jarvis/tools exec vitest run shared-connection
          pnpm --filter @jarvis/agents exec vitest run shared-connection

      # Phase 18, Stage 18.1 — the Automation Library's pure rules in core:
      # normalization and fingerprints, cursor and instance hashing, failure
      # naming, state. Stage 18.2 adds the shared request rules, the chain
      # contract and the voice policy (core), the tools and the executor's refusal
      # of a spoken sync (tools), and the orchestrator's (agents). Stage 18.3B adds
      # the sanitized inspection and the proposal contract (core) and the
      # approval-gated allow-list tool (tools). Stage 18.4 adds matching and the
      # draft model (core), the planning tools (tools) and the automation agent's
      # grant and gate (agents). Stage 18.5 adds the trusted node-schema rules
      # (core), the tools' bounded summary (tools) and the agent's honesty about
      # what a validated draft means (agents). Selected by file name, as the
      # other core contracts are. The library's engine, service, routes, tools
      # and chains run in "Test @jarvis/api", the n8n read that 18.3B reduces in
      # "Test @jarvis/n8n" — as does the committed node-schema snapshot — and its
      # PostgreSQL suites in the database steps below.
      - name: Test automation library contracts (@jarvis/core, @jarvis/tools, @jarvis/agents)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm --filter @jarvis/core exec vitest run automation-library
          pnpm --filter @jarvis/tools exec vitest run automation-library
          pnpm --filter @jarvis/agents exec vitest run automation-library

      # Phase 19, Stage 19.1 — the Computer & Browser Control contracts:
      # closed action sets and bounds, the shared-connection mapping, the
      # value-free approval summary/binding, and the executor's refusal of a
      # sensitive spoken action before it runs. Selected by file name, as the
      # other core/tools contracts are. @jarvis/security (the reused policy) is
      # gated as a whole above and @jarvis/api (the approval summary) below.
      # `sprint7-browser-tools` holds the browser tools' 19.1 behaviour — atomic
      # single-use consumption with the Organization's scope, and the strict
      # request contract — so it is selected here too.
      #
      # Phase 19.5 adds the value-free approval record and the UNKNOWN answers
      # (core and tools, same names) and the chat's confirmation message for a
      # browser or desktop action (`computer-control` in @jarvis/agents, which
      # CI does not run as a whole). The sealed parameters are proven against
      # PostgreSQL in the database steps below (@jarvis/db as a whole, and
      # `computer-control-sealed-approval-p19-pg` in @jarvis/api).
      - name: Test computer-control contracts (@jarvis/core, @jarvis/tools, @jarvis/agents)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm --filter @jarvis/core exec vitest run computer-control
          pnpm --filter @jarvis/tools exec vitest run computer-control sprint7-browser-tools
          pnpm --filter @jarvis/agents exec vitest run computer-control

      # Phase 19, Stage 19.2 — the isolated browser service. The protocol
      # workspace holds the versioned envelope, the signing and replay rules,
      # the size and deadline bounds, the endpoint loader and the API's typed
      # client; the service workspace holds its own refusals — no caller
      # identity, no session, a cross-Organization reuse, a disabled engine, a
      # provider error's words kept out of the response and the log — and,
      # since the Stage 19.2 audit, the write outcomes (an uncertain write is
      # never a plain failure), the mutual-TLS-only configuration, the loopback
      # health listener, Chromium's sandbox launch option and the compose
      # file's isolation of the browser container. The service suite runs real
      # mutual TLS on 127.0.0.1, with certificates made for the run and a fake
      # engine, so no Chromium starts and no external site is reached. Selected
      # by file name, because neither workspace is gated as a whole.
      #
      # Phase 19.3 adds the browser's egress: the proxy's policy and its
      # behaviour over loopback sockets (`browser-service-egress`, with DNS and
      # dialling replaced, so nothing is resolved or dialled off the machine),
      # and the address, host-name and navigation rules in @jarvis/browser that
      # it and the API's own page reads share.
      #
      # Phase 19.4 adds the durable artifact store (`artifact-store`,
      # `download`) and the session's use of it (`session`): owner and
      # Organization scoping, foreign and stale ids as not found, quotas under
      # concurrency, expiry, interrupted writes, corrupt or tampered records,
      # and a restart or a second instance over the same directory — each on a
      # temporary directory made for the test. The engine's start-up
      # refusals are in the service suite above.
      - name: Test browser-service contracts (@jarvis/browser-protocol, @jarvis/browser-service, @jarvis/browser)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm --filter @jarvis/browser-protocol exec vitest run browser-service
          pnpm --filter @jarvis/browser-service exec vitest run browser-service
          pnpm --filter @jarvis/browser exec vitest run ip-rules host-rules navigation-policy artifact-store download session

      # Phase 19, Stage 19.1 — the Meta Ads write boundary: all nine writes run
      # only with the executor's grant for that exact call, consume their
      # approval once with the Organization's scope, and leave the journal in
      # the right state. `meta-ads` selects the write-boundary suite and the
      # Meta tool suites; the other three exercise the same writes' journal,
      # timeout and concurrency behaviour. Selected by file name.
      - name: Test Meta Ads write contracts (@jarvis/tools)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @jarvis/tools exec vitest run meta-ads write-tools-timeout-classification phase102-concurrency-tools execution-journal

      # Phase 19, Stage 19.1 — the byte-for-byte pins of the tool-execution
      # boundary: the executor and the registry (`mcp-boundaries-s8` in core,
      # `mcp-tools-boundaries-s8` in tools). The grant module's own pin and who
      # may issue or verify a grant are in `computer-control-write-boundary`,
      # selected above. A change to any of these files fails here until its
      # digest is updated deliberately.
      - name: Test tool-execution boundary pins (@jarvis/core, @jarvis/tools)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm --filter @jarvis/core exec vitest run mcp-boundaries-s8
          pnpm --filter @jarvis/tools exec vitest run mcp-tools-boundaries-s8

      # From here on, the PostgreSQL-backed tests. DATABASE_URL is set on these
      # steps only, so nothing above ever sees a database. Applying every
      # migration to the empty database first fails the run if it is unreachable
      # or a migration cannot apply from scratch (R-22).
      - name: Apply migrations to the CI database
        id: migrate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://jarvis_ci:jarvis_ci@127.0.0.1:5436/jarvis_ci?schema=public
        run: pnpm --filter @jarvis/db exec prisma migrate deploy

      - name: Test @jarvis/db (PostgreSQL)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://jarvis_ci:jarvis_ci@127.0.0.1:5436/jarvis_ci?schema=public
          JARVIS_REQUIRE_POSTGRES: "1"
        run: pnpm --filter @jarvis/db exec vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-db.json"

      - name: Test @jarvis/memory (PostgreSQL)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://jarvis_ci:jarvis_ci@127.0.0.1:5436/jarvis_ci?schema=public
          JARVIS_REQUIRE_POSTGRES: "1"
        run: pnpm --filter @jarvis/memory exec vitest run pg.integration --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-memory.json"

      - name: Test @jarvis/api (PostgreSQL)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://jarvis_ci:jarvis_ci@127.0.0.1:5436/jarvis_ci?schema=public
          JARVIS_REQUIRE_POSTGRES: "1"
        run: pnpm --filter @jarvis/api exec vitest run pg.integration sprint-1.1d-memory-e2e --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-api.json"

      # Phase 14 — the memory quality evaluation: the version-controlled dataset
      # through the production extraction service and the real repository, with
      # deterministic embeddings and an eager stand-in model. It prints its
      # report — precision, recall, forbidden-memory rate, retrieval relevance,
      # control compliance, correction and project-isolation pass rates, and
      # the weight comparison — and fails the run if a floor is missed. It has
      # already run once inside the memory step above; here it is its own gate
      # and its report is in the log. No model provider is called. Its JSON
      # report goes to the skip check below: a gate whose tests all skipped
      # (no database) would otherwise pass.
      - name: Memory quality evaluation (PostgreSQL, deterministic)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://jarvis_ci:jarvis_ci@127.0.0.1:5436/jarvis_ci?schema=public
        run: pnpm --filter @jarvis/memory exec vitest run memory-quality-eval-p14-pg --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-eval.json"

      # These suites skip themselves when they cannot reach their database, and
      # vitest counts a skip as a pass. Here a skip means the database never
      # reached the test, so any skipped test — or a missing report — fails.
      - name: No PostgreSQL test was skipped
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: node .github/scripts/assert-no-skipped-tests.mjs "$RUNNER_TEMP/vitest-db.json" "$RUNNER_TEMP/vitest-memory.json" "$RUNNER_TEMP/vitest-api.json" "$RUNNER_TEMP/vitest-eval.json"

  # Phase 19.6 — the Windows desktop agent (.NET 10, apps/desktop-agent).
  # Restores and builds both projects with warnings as errors; runs the
  # platform-neutral tests (the C# protocol held to the TypeScript one through
  # apps/desktop-agent/contract, verification, consent, execution with fakes,
  # the signed client, the source boundary scan) and the Windows tests (the
  # CNG device key is non-exportable, the compiled agent references no
  # listening, process, screen, clipboard or registry API); then packs the
  # per-user MSIX, refuses a manifest that is not exactly the approved one,
  # signs it with a throwaway TEST certificate, and verifies the signature and
  # that the signer is the Publisher. The runner is Windows Server, where the
  # agent stops at its Windows 11 check: so the job shows only that start-up
  # opens no port, never that a paired agent opens none. That proof is
  # packaging/check-no-listener.ps1 on a Windows 11 test machine; here the job
  # proves that script refuses when no agent is running. Nothing here sends
  # input, and no test calls SendInput. The test-signed package is not uploaded.
  desktop-agent:
    name: Windows desktop agent (.NET, MSIX)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop-agent
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/desktop-agent/global.json

      - name: Runner and Windows version
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Runner: $($os.Caption) build $($os.BuildNumber), $env:PROCESSOR_ARCHITECTURE"
          dotnet --version

      - name: Restore
        run: |
          dotnet restore tests/Jarvis.DesktopAgent.Core.Tests/Jarvis.DesktopAgent.Core.Tests.csproj
          dotnet restore tests/Jarvis.DesktopAgent.Windows.Tests/Jarvis.DesktopAgent.Windows.Tests.csproj

      - name: Build (warnings are errors)
        run: |
          dotnet build tests/Jarvis.DesktopAgent.Core.Tests/Jarvis.DesktopAgent.Core.Tests.csproj -c Release --no-restore
          dotnet build tests/Jarvis.DesktopAgent.Windows.Tests/Jarvis.DesktopAgent.Windows.Tests.csproj -c Release --no-restore

      - name: Test the agent core (protocol contract, verification, consent, execution, client)
        run: dotnet test tests/Jarvis.DesktopAgent.Core.Tests/Jarvis.DesktopAgent.Core.Tests.csproj -c Release --no-build

      - name: Test the Windows parts (device key, compiled boundaries, platform checks)
        run: dotnet test tests/Jarvis.DesktopAgent.Windows.Tests/Jarvis.DesktopAgent.Windows.Tests.csproj -c Release --no-build

      - name: Pack, sign (test certificate) and verify the MSIX
        run: ./packaging/build-msix.ps1 -Publisher "CN=JARVIS Test Signing" -TestCertificate -TrustTestCertificate

      # Start-up only: this runner stops the agent at its platform check, and
      # this step starts the runner's only copy. It is not the exit criterion's
      # proof, and packaging/check-no-listener.ps1 never starts an agent.
      - name: Start-up opens no port
        run: |
          $agent = Start-Process -FilePath (Resolve-Path artifacts/publish/Jarvis.DesktopAgent.exe) -PassThru
          try {
            Start-Sleep -Seconds 10
            $listening = @(Get-NetTCPConnection -ErrorAction Stop | Where-Object { $_.OwningProcess -eq $agent.Id -and $_.State -eq "Listen" })
            $udp = @(Get-NetUDPEndpoint -ErrorAction Stop | Where-Object { $_.OwningProcess -eq $agent.Id })
            if ($listening.Count -gt 0 -or $udp.Count -gt 0) { throw "the agent opened a port at start-up." }
            Write-Host "Start-up opened no TCP listener and no UDP endpoint (pid $($agent.Id)). This says nothing about a paired agent."
          } finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
          }

      - name: The port check refuses when no agent is running
        run: |
          pwsh -NoProfile -File ./packaging/check-no-listener.ps1 -Seconds 1
          if ($LASTEXITCODE -ne 1) { throw "check-no-listener did not refuse with no agent running (exit $LASTEXITCODE)." }
          exit 0
