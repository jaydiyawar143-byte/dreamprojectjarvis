services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-web
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
    command: sh -lc "cd /workspace/apps/web && pnpm dev --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped
